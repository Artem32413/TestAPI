basePath: /api/v1
definitions:
  structs.AllInformationAboutTheProduct:
    properties:
      barcode:
        type: string
      characteristics:
        items:
          additionalProperties:
            type: string
          type: object
        type: array
      description:
        type: string
      discount:
        type: number
      name:
        type: string
      price:
        type: number
      productId:
        type: string
      quantity:
        type: integer
      weight:
        type: number
    type: object
  structs.InventorySwagger1:
    properties:
      price:
        example: 999.99
        type: number
      productId:
        example: 36c6ecf5-1e13-4cef-a591-bc8368fa0e60
        type: string
      warehouseId:
        example: 9be99fa0-2cd1-4c4e-863d-5115095fbd09
        type: string
    type: object
  structs.InventorySwagger2:
    properties:
      productId:
        example: 36c6ecf5-1e13-4cef-a591-bc8368fa0e60
        type: string
      quantity:
        example: 5
        type: integer
      warehouseId:
        example: 9be99fa0-2cd1-4c4e-863d-5115095fbd09
        type: string
    type: object
  structs.InventorySwagger4:
    properties:
      productId:
        example: 36c6ecf5-1e13-4cef-a591-bc8368fa0e60
        type: string
      warehouseId:
        example: 9be99fa0-2cd1-4c4e-863d-5115095fbd09
        type: string
    type: object
  structs.InventorySwagger5:
    properties:
      sum:
        type: number
    type: object
  structs.ListByWarehouse:
    properties:
      discount:
        type: number
      name:
        type: string
      price:
        type: number
      productId:
        type: string
    type: object
  structs.NewInventory:
    description: Данные для создания или обновления инвентарной записи
    properties:
      product:
        items:
          $ref: '#/definitions/structs.ProductInventory2'
        type: array
      warehouseId:
        example: 9be99fa0-2cd1-4c4e-863d-5115095fbd09
        type: string
    type: object
  structs.NewInventoryDiscount:
    description: Данные для установки скидки на товары
    properties:
      discount:
        description: Размер скидки (0.2 = 20%)
        example: 0.2
        type: number
      productId:
        example:
        - 881670ed-8195-43d6-b678-3741bd3289ae
        - 25f8f0ba-75f0-4caa-8648-27f6be3254b3
        items:
          type: string
        type: array
      warehouseId:
        example: 9be99fa0-2cd1-4c4e-863d-5115095fbd09
        type: string
    type: object
  structs.ProductInventory2:
    description: Упрощенная структура товара для операций
    properties:
      productId:
        example: 881670ed-8195-43d6-b678-3741bd3289ae
        type: string
      quantity:
        example: 5
        type: integer
    type: object
  structs.WarehousePagination:
    description: Параметры пагинации для списка товаров на складе
    properties:
      limit:
        description: Количество элементов на странице
        example: 10
        type: integer
      offset:
        description: Смещение (номер страницы * limit)
        example: 0
        type: integer
      warehouseId:
        example: 9be99fa0-2cd1-4c4e-863d-5115095fbd09
        type: string
    type: object
host: localhost:8083
info:
  contact:
    email: support@example.com
    name: API Support
    url: http://www.example.com/support
  description: This is a sample API Go server with Zap logging
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: API Go Service
  version: "1.0"
paths:
  /inventory/count/:
    patch:
      consumes:
      - application/json
      description: Возвращает сумму стоимости указанных товаров с учетом скидок
      parameters:
      - description: Список товаров для подсчета
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/structs.NewInventory'
      produces:
      - application/json
      responses:
        "200":
          description: Итоговая стоимость
          schema:
            $ref: '#/definitions/structs.InventorySwagger5'
        "400":
          description: Неверно введены данные
        "500":
          description: Внутренняя ошибка сервера
      summary: Подсчет стоимости
      tags:
      - Inventory
  /inventory/discount/:
    patch:
      consumes:
      - application/json
      description: Устанавливает скидку на указанные товары на складе
      parameters:
      - description: Данные для скидки
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/structs.NewInventoryDiscount'
      produces:
      - application/json
      responses:
        "200":
          description: Скидка успешно применена
        "400":
          description: Неверные входные данные
        "500":
          description: Внутренняя ошибка сервера
      summary: Установить скидку
      tags:
      - Inventory
  /inventory/goods/:
    get:
      consumes:
      - application/json
      description: Возвращает список товаров на указанном складе с пагинацией
      parameters:
      - description: Параметры пагинации
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/structs.WarehousePagination'
      produces:
      - application/json
      responses:
        "200":
          description: Список товаров
          schema:
            items:
              $ref: '#/definitions/structs.ListByWarehouse'
            type: array
        "400":
          description: Неверные входные данные
        "500":
          description: Внутренняя ошибка сервера
      summary: Список товаров
      tags:
      - Inventory
  /inventory/price/:
    post:
      consumes:
      - application/json
      description: Устанавливает цену для конкретного товара на указанном складе
      parameters:
      - description: Данные установки цены
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/structs.InventorySwagger1'
      produces:
      - application/json
      responses:
        "200":
          description: Цена успешно установлена
        "400":
          description: Неверные входные данные
        "500":
          description: Внутренняя ошибка сервера
      summary: Установить цену товара
      tags:
      - Inventory
  /inventory/product/:
    get:
      consumes:
      - application/json
      description: Возвращает полную информацию о товаре на складе
      parameters:
      - description: Идентификаторы склада и товара
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/structs.InventorySwagger4'
      produces:
      - application/json
      responses:
        "200":
          description: Полная информация о товаре
          schema:
            $ref: '#/definitions/structs.AllInformationAboutTheProduct'
        "400":
          description: Неверные входные данные
        "500":
          description: Внутренняя ошибка сервера
      summary: Информация о товаре
      tags:
      - Inventory
  /inventory/purchase/:
    delete:
      consumes:
      - application/json
      description: Обрабатывает покупку товаров и уменьшает их количество на складе
      parameters:
      - description: Данные о покупке
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/structs.NewInventory'
      produces:
      - application/json
      responses:
        "200":
          description: Покупка успешно обработана
        "400":
          description: Неверные входные данные или недостаточно товара
        "500":
          description: Внутренняя ошибка сервера
      summary: Покупка товаров
      tags:
      - Inventory
  /inventory/updateQuantity/:
    patch:
      consumes:
      - application/json
      description: Увеличивает количество товара на складе
      parameters:
      - description: Данные обновления количества
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/structs.InventorySwagger2'
      produces:
      - application/json
      responses:
        "200":
          description: Количество успешно обновлено
        "400":
          description: Неверные входные данные
        "500":
          description: Внутренняя ошибка сервера
      summary: Обновить количество товара
      tags:
      - Inventory
schemes:
- http
swagger: "2.0"
